<script>const expected='8029a94bbeb0d84ec1d9b58a354c52c5ba98a03692dc3c43e5e54e9b88cb8a47',gate=document.getElementById('gate'),chooser=document.getElementById('chooser');function unlock(){sessionStorage.setItem('wedding-card-access','ok');gate.classList.add('hide');chooser.classList.add('show')}if(sessionStorage.getItem('wedding-card-access')==='ok')unlock();else setTimeout(()=>document.getElementById('code').focus(),0);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const v=new TextEncoder().encode(document.getElementById('code').value),d=await crypto.subtle.digest('SHA-256',v),h=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');if(h===expected)unlock();else{document.getElementById('error').textContent='密码不正确，请向制作方确认。';document.getElementById('code').select()}});</script></body></html>
